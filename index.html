<head>

  <title>部室管理 | ソフトメディア研究会</title>
  <style>
    /* Layout.tsx / globals.css: shared canvas, typography and theme colors. */
    :root{color-scheme:light;--bg:#fff;--card:#fff;--soft:#f9fafb;--text:#111827;--muted:#6b7280;--line:#f3f4f6;--control-line:#e5e7eb;--green:#15803d;--blue:#526fb4;--red:#b4535e;--shadow:0 1px 2px 0 #0000000d;--program:#00c853;--dtm:#2962ff;--multimedia:#d50000}
    :root.dark{color-scheme:dark;--bg:#030712;--card:#111827;--soft:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#1f2937;--control-line:#374151;--green:#7bff81;--blue:#94a7d4;--red:#d69a9f;--program:#7bff81;--dtm:#7b87ff;--multimedia:#ff7b7b}
    *{box-sizing:border-box}html{font-size:clamp(14px,1vw + 12px,18px)}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65}button,select,input{font:inherit}button,select{cursor:pointer;touch-action:manipulation}button{color:inherit;transition:background .2s,color .2s,border-color .2s}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}[hidden]{display:none!important}p{margin:0}svg{display:block}
    /* Header.tsx: bg-white/80, gray-900/80, backdrop-blur-md, h-14. */
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.dark header{background:rgba(17,24,39,.8)}.nav{max-width:1180px;height:56px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0;font-weight:700;letter-spacing:-.05em;color:#111827}.dark .brand{color:#fff}.brand-logo{display:block;width:32px;height:32px;object-fit:contain;flex-shrink:0}.brand-name{font-size:clamp(14px,2vw + 8px,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}.account{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 6px;border:1px solid var(--control-line);border-radius:999px;background:var(--card)}.account-avatar{display:grid;place-items:center;width:28px;height:28px;flex-shrink:0;border-radius:50%;background:rgba(82,111,180,.1);color:var(--blue);font-size:12px;font-weight:700}.account select{min-height:30px;max-width:128px;padding:3px 22px 3px 2px;border:0;border-radius:99px;background:transparent;color:var(--text);font-size:14px;font-weight:600}.theme{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--control-line);border-radius:999px;background:var(--card);color:var(--muted)}.theme:hover{background:var(--soft);color:var(--text)}.theme svg{width:16px;height:16px}
    main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:32px 24px 40px}h1{font-size:30px;letter-spacing:-.025em;line-height:1.3;margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--control-line);font-weight:700}h2{font-size:20px;line-height:1.45;font-weight:700;margin:0}.small{font-size:12px;color:var(--muted)}
    /* Blog page filters: rounded-full, gray-100/gray-800, border-gray-200/gray-700. */
    .view-nav{display:flex;gap:4px;padding:4px;margin-bottom:24px;border:1px solid var(--control-line);border-radius:12px;background:#f3f4f6}.dark .view-nav{background:#1f2937}.view-nav button{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}.view-nav button:hover{color:var(--text);background:rgba(255,255,255,.5)}.dark .view-nav button:hover{background:rgba(55,65,81,.5)}.view-nav button[aria-current=page]{background:#fff;color:#111827;box-shadow:var(--shadow)}.dark .view-nav button[aria-current=page]{background:#374151;color:#f9fafb;box-shadow:none}
    /* Home news and About cards: rounded-2xl, p-6, shadow-sm, gray-100/gray-800 border. */
    .workspace{display:block}.card{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:24px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.room-summary{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:16px}.summary-open{color:var(--green)}.mismatch,.member-notice,.feedback{padding:12px 14px;font-size:13px;line-height:1.8;border:1px solid var(--control-line);border-radius:8px;background:var(--soft)}.mismatch{margin-bottom:16px;color:#b91c1c;border-left:3px solid var(--red)}.dark .mismatch{color:#fca5a5}.member-notice{margin-bottom:16px}.feedback{margin-top:16px;border-left:3px solid var(--blue)}
    /* Not-found button: rounded-lg, medium weight and gray borders; operation colors use the site's team palette. */
    .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.action{min-width:0;min-height:52px;padding:12px 6px;border:1px solid var(--control-line);border-radius:8px;background:var(--card);text-align:center;font-size:13px;font-weight:600}.action strong{display:block;font-size:13px;font-weight:600}.action span:last-child{display:none}.action:hover{background:var(--soft)}.action[data-action=unlock],.action[data-action=enter]{color:var(--blue);border-color:var(--blue)}.action[data-action=leave],.action[data-action=close]{color:var(--red);border-color:var(--red)}.action.recommended{grid-column:1/-1;grid-row:1;min-height:120px;padding:24px 16px;border-radius:12px;background:var(--blue);border-color:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}.action.recommended strong{font-size:28px;font-weight:700;letter-spacing:-.025em}.action.recommended[data-action=leave],.action.recommended[data-action=close]{background:var(--red);border-color:var(--red);color:#fff}.dark .action.recommended{color:#111827}.action.recommended:hover{opacity:.9}
    .status{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.4}.dot{width:10px;height:10px;flex-shrink:0;background:var(--muted);border-radius:50%;box-shadow:0 0 0 5px var(--soft)}.status.open{color:var(--green)}.status.open .dot{background:var(--green)}.opener{font-size:13px;color:var(--muted);margin-top:12px}.pending{margin-top:12px;font-size:13px;color:var(--red)}.occupant-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;margin-top:24px;border-top:1px solid var(--line)}.count{font-size:12px;padding:3px 10px;background:#f3f4f6;color:#374151;border-radius:999px}.dark .count{background:#1f2937;color:#d1d5db}.people{display:grid;align-content:start;gap:10px;max-height:360px;overflow:auto;list-style:none;margin:16px 0 0;padding:0}.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft)}.avatar{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:50%;background:rgba(82,111,180,.1);color:var(--blue);font-size:12px;font-weight:700}.dark .avatar,.dark .account-avatar{background:rgba(148,167,212,.15)}.person-name{font-size:14px;font-weight:600}.person-time{font-size:11px;color:var(--muted)}.empty{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted);padding:16px 0}.empty-icon{opacity:.6}.empty-icon svg{width:24px;height:24px}
    .history{margin-top:24px}.history-list{display:grid;gap:12px;list-style:none;margin:0;padding:0}.event{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.event-entry{background:rgba(82,111,180,.035);border-color:rgba(82,111,180,.12)}.event-exit{background:rgba(180,83,94,.025);border-color:rgba(180,83,94,.1)}.dark .event-entry{background:rgba(148,167,212,.07);border-color:rgba(148,167,212,.15)}.dark .event-exit{background:rgba(214,154,159,.06);border-color:rgba(214,154,159,.15)}.event-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.event-title{min-width:0;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:#374151;overflow-wrap:anywhere}.dark .event-title{background:#1f2937;color:#d1d5db}.event-entry .event-title{background:#e7edf8;color:#455f9b}.event-exit .event-title{background:#f7e9ec;color:#994650}.dark .event-entry .event-title{background:rgba(82,111,180,.2);color:#b1bfe0}.dark .event-exit .event-title{background:rgba(180,83,94,.2);color:#e1b2b7}.event-top time{flex-shrink:0;font-size:11px;color:var(--muted)}.event-actor{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}.event-actor .avatar{width:28px;height:28px;font-size:10px}.event-actor strong{font-weight:600}.event-notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.event-note{border:1px solid var(--control-line);border-radius:999px;padding:2px 8px;background:var(--card);font-size:11px;color:var(--muted);overflow-wrap:anywhere}.history-group{padding-top:10px;margin-top:12px;border-top:1px solid var(--line)}.history-group-heading{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}.history-group-heading span:last-child{font-size:11px;font-weight:400;color:var(--muted)}.history-group-auto .history-group-heading{color:var(--muted)}.history-members{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:8px 0 0;padding:0}.history-members li{max-width:100%;padding:3px 9px;border:1px solid var(--control-line);border-radius:999px;background:var(--card);font-size:12px;overflow-wrap:anywhere}.history-empty{font-size:13px;color:var(--muted);padding:16px 0}
    .demo-tools{margin-top:24px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.demo-tools summary{cursor:pointer;min-height:24px;font-size:12px;color:var(--muted)}.tools-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}.tools-row label{font-size:12px;color:var(--muted)}select{max-width:100%;padding:8px 28px 8px 10px;border:1px solid var(--control-line);border-radius:8px;background:var(--card);color:var(--text)}.btn{min-height:44px;padding:10px 16px;border:1px solid var(--control-line);border-radius:8px;background:var(--card);font-size:13px;font-weight:500}.btn:hover:not(:disabled){background:var(--soft)}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover:not(:disabled){background:var(--blue);opacity:.9}.dark .primary{color:#111827}.danger{color:var(--red)}
    dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 40px);overflow:auto;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);box-shadow:0 20px 25px -5px #0003,0 8px 10px -6px #0003}dialog::backdrop{background:rgba(3,7,18,.6);backdrop-filter:blur(4px)}dialog h2{font-size:22px;line-height:1.5;letter-spacing:-.025em}#dialog-title:focus{outline:none}.dialog-tag{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px}.description{margin-top:10px;white-space:pre-line;font-size:13px;line-height:1.8;color:var(--muted)}.description:empty{display:none}.dialog-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:24px}.dialog-actions.choice-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.choice-action{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:78px;padding:16px;text-align:left;background:var(--soft);border-radius:12px}.choice-action strong{display:block;font-size:15px;line-height:1.5;font-weight:600}.choice-description{display:block;margin-top:4px;font-size:12px;line-height:1.7;color:var(--muted)}.choice-arrow{font-size:26px;line-height:1;color:var(--blue)}.choice-action:hover{border-color:var(--blue)}.choice-actions .dialog-cancel{grid-row:3;width:100%;border:0;background:transparent;color:var(--muted)}.review-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font-size:12px}.review-toolbar strong{font-size:14px;color:var(--text)}.review-toolbar .btn{flex-shrink:0;white-space:nowrap}.review-list{display:grid;gap:10px;margin-top:12px}.checklist{display:grid;gap:10px;margin-top:20px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);cursor:pointer}.switch-row strong{display:block;font-size:14px;font-weight:600}.switch-row .small{display:block;margin-top:2px}.switch{position:relative;flex-shrink:0;width:44px;height:26px}.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}.switch-track{display:block;width:44px;height:26px;border-radius:999px;background:#9ca3af;transition:background .15s}.dark .switch-track{background:#4b5563}.switch-track:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}.switch input:checked+.switch-track{background:var(--blue)}.switch input:checked+.switch-track:after{transform:translateX(18px)}.switch input:focus-visible+.switch-track{outline:3px solid var(--blue);outline-offset:3px}
    .success-toast{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border:1px solid #bbf7d0;border-radius:12px;background:var(--card);color:var(--text);box-shadow:0 10px 15px -3px #0002;pointer-events:none;font-size:13px;font-weight:600;animation:toast-in .2s ease-out}.dark .success-toast{border-color:#166534}.toast-check{display:grid;place-items:center;flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--card)}@keyframes toast-in{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
    /* Footer.tsx: gray-50/gray-900 surface, thin top border, copyright and links. */
    footer{background:#f9fafb;border-top:1px solid var(--line)}.dark footer{background:#111827}.footer-inner{max-width:1180px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted)}.footer-links{display:flex;gap:24px}.footer-links a{color:inherit;text-decoration:none}.footer-links a:hover{color:var(--text);text-decoration:underline;text-underline-offset:4px}
    @media(max-width:600px){.nav{padding:0 16px;gap:10px}.brand{gap:10px}.brand-name{font-size:14px}.nav-right{gap:8px}.account{position:relative;width:40px;height:40px;min-height:40px;padding:0;justify-content:center}.account select{position:absolute;inset:0;width:100%;max-width:none;min-height:40px;opacity:0;padding:0}.account:focus-within{outline:3px solid var(--blue);outline-offset:3px}.theme{width:34px;height:34px}main{padding:24px 16px 32px}h1{font-size:26px;margin-bottom:20px;padding-bottom:12px}.view-nav{gap:4px;margin-bottom:20px}.view-nav button{padding:8px 6px;font-size:12px}.card{padding:20px}.card-head{margin-bottom:16px}h2{font-size:18px}.operation-card h2{font-size:16px}.card-head .small{font-size:11px}.action strong{font-size:12px}.action.recommended strong{font-size:26px}.event{padding:14px}.event-top time{font-size:10px}.dialog-actions{position:sticky;bottom:-24px;background:var(--card);padding:12px 0;margin-top:16px}.dialog-actions.choice-actions{position:static;padding:0;margin-top:24px}.dialog-actions .primary{flex:1}.switch-row{padding:12px}.switch-row strong{font-size:13px}.tools-row label{width:100%}.tools-row select{width:100%}.footer-inner{padding:24px 16px;flex-direction:column;text-align:center;gap:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>

    }
    $('member').innerHTML=MEMBERS.map(member=>'<option value="'+member.id+'">'+escapeHTML(member.name)+'</option>').join('');
    $('member').addEventListener('change',()=>{hideSuccess();lastRecordedIntent=null;$('feedback').hidden=true;render();});
    document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.route)));
    window.addEventListener('popstate',()=>{hideSuccess();const params=new URLSearchParams(location.search);mode=params.get('mode')==='exit'?'exit':'enter';view=params.get('view')==='status'?'status':'operation';dismiss();lastRecordedIntent=null;$('feedback').hidden=true;render();});
    document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>operate(button.dataset.action)));
    $('flow').addEventListener('cancel',()=>{flowActor=null;feedback('確認画面を閉じました。');});
    $('load-scenario').addEventListener('click',()=>{
      dismiss();lastRecordedIntent=null;state=sampleState($('scenario').value);$('member').value='cone';render();
      feedback($('scenario').value==='unrecorded'?'先客の入室記録がない状態に設定しました。':$('scenario').value==='stale'?'不在のA・Bの在室記録が残っている状態に設定しました。':'状態を設定しました。');
    });
    $('reset').addEventListener('click',()=>{dismiss();lastRecordedIntent=null;state=initialState();$('member').value='cone';$('scenario').value='closed';render();feedback('初期状態にリセットしました。');});
    $('night').addEventListener('click',()=>{dismiss();dispatch({type:'NIGHT'});feedback('22時処理で在室記録を全員解除し、閉室中にしました。実際の施錠は未確認です。');});
    const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(dark){document.documentElement.classList.toggle('dark',dark);$('theme').innerHTML=dark?"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42\"/></svg>":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20.985 12.486A9 9 0 1 1 11.51 3.01a7 7 0 0 0 9.475 9.475z\"/></svg>";$('theme').setAttribute('aria-label',dark?'ライトモードに切り替え':'ダークモードに切り替え');}
    applyTheme(themeQuery.matches);
    $('theme').addEventListener('click',()=>applyTheme(!document.documentElement.classList.contains('dark')));
    render();
  </script>
</body>
</html>
